# Opt-in node_exporter wiring for KTC Mail metrics.
#
# KTC Mail's exporter writes Prometheus text to
# /var/lib/ktc-mail/metrics.prom (collected by ktc-mail-exporter.service).
# To scrape those series, point node_exporter's textfile collector at that
# directory. Drop this file into place (as root) on a host that runs
# prometheus-node-exporter:
#
#   install -D -m 0644 this-file \
#     /etc/systemd/system/prometheus-node-exporter.service.d/ktc-mail.conf
#   systemctl daemon-reload
#   systemctl restart prometheus-node-exporter
#
# Harmless if node_exporter is not installed (not auto-enabled by the package).
[Service]
ExecStart=
ExecStart=/usr/bin/prometheus-node-exporter \
    --collector.textfile.directory=/var/lib/ktc-mail
